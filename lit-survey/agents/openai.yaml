interface:
  display_name: "Lit Survey"
  short_description: "跨论文梳理奠基工作、研究演进、阅读路线与 related work。"
  default_prompt: "Use $lit-survey for the requested cross-paper literature survey, foundational-paper search, research lineage, reading route, or related-work comparison. Run only the stages needed for the requested output and reuse existing anchors, evidence, preferences, and authorization. Load references as needed. Locate evidence for research claims and distinguish your reading from mine. For a full final report, preserve the preference for PDF when an existing LaTeX environment supports it; do not compile brief answers or intermediate updates automatically."
